# Phase 2 vertical slice: a fleet on the real Manhattan network, one vehicle that lies,
# roadside units at the signalised intersections of two equipped avenues, the CAMP SCMS
# backend reached over each vehicle's cellular link, and a revocation that reaches the
# fleet by cellular download and by roadside broadcast.
#
# 10-roadmap.md's Phase 2 is a *path*, not a feature list, and this file is that path:
#
#   the liar broadcasts a frozen position
#     -> honest vehicles' detector suites fire on the inconsistency
#     -> each files a misbehaviour report and uploads it over its cellular modem
#        (a report is backend traffic: it never goes on the sidelink broadcast unless a
#        vehicle has no modem and relays through a roadside unit)
#     -> the Location Obscurer Proxy strips the network identifiers, the RA shuffles
#     -> the Misbehaviour Authority's persistence gate (threat/ma/legacy-window) sees
#        sustained evidence from several trusted reporters and decides to revoke
#     -> the PCA identifies the certificate's request, the RA blocklists the device, both
#        Linkage Authorities release their seeds, the CRL Generator issues on its cadence
#     -> the CRL Store publishes; cellular vehicles download it, and the roadside units
#        with the `crl` role broadcast it
#     -> every vehicle that installs it stops trusting the liar, and the liar, finding
#        itself on the list, stops transmitting
#
# Run it, and inspect the decomposition, with:
#
#     v2xw run scenarios/phase2-manhattan.yaml --out runs/phase2
schema: v2xw/scenario/1

meta:
  name: phase2-manhattan
  description: >-
    An equipped fleet on the real Manhattan network, one of them a ConstPos attacker,
    55 roadside units at the signalised intersections of 5th and 6th Avenues, the CAMP
    SCMS backend over cellular Uu, the legacy twelve-detector suite on every honest node,
    the legacy persistence-gated authority, and a revocation distributed by cellular
    download and roadside broadcast.
  authors: [v2xw]
  tags: [phase2, manhattan, osm, dsrc, signed, scms, misbehaviour, revocation, cellular]
  created: "2026-09-22"

seed: "0xC0FFEE_5EED"

time:
  t0: "2027-03-04T08:00:00Z"
  duration_s: 300.0
  mobility_step_ms: 100
  des_resolution: 1us

world:
