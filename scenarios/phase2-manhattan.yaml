    kind: osm-xml
    path: worlds/cache/manhattan.osm.xml
    bbox:
      min_lat_deg: 40.7440
      min_lon_deg: -73.9900
      max_lat_deg: 40.7620
      max_lon_deg: -73.9680
  highway_preset: urban-us-nyc
  imported_at: "2026-09-18T00:00:00Z"
  buildings:
    # On. Buildings obstruct the sidelink (Sommer), which is what a Midtown street grid
    # does to 5.9 GHz. The misbehaviour reports no longer depend on it: they are backend
    # traffic and travel over each vehicle's cellular link, as in a deployment (a single
    # roadside mast used to hear 2 of 30 reports behind the towers).
    enabled: true
    keep_holes: true
  terrain:
    dem: null

actors:
  vehicles:
    equipped_fraction: 1.0
    demand:
      kind: mobility/demand/poisson
      rate_veh_per_h: 600.0

  # Roadside units at every signalised intersection of 5th and 6th Avenues in the
  # extract, 27th to 55th Street, read off the imported network with
  #   cargo run -p v2xw-engine --example rsu_sites -- scenarios/phase2-manhattan.yaml \
  #       "5th Avenue" "6th Avenue"
  # (one signalised junction on 6th Avenue with no cross street is left out).
  #
  # The density is the NYC Connected Vehicle Pilot's: its Manhattan roadside units were
  # installed at signalised intersections along avenue corridors that included 5th and
  # 6th Avenues (USDOT ITS JPO, NYC CV Pilot deployment documentation). The pilot's exact
  # intersection list is not in the design set, so "every signalised intersection of the
  # two avenues inside the box" is this file's reading of it and is stated as such.
  #
  # Each unit relays reports for a vehicle with no modem (`report-forward`), carries
  # certificate top-ups (`provisioning-proxy`) and broadcasts the CRL it holds (`crl`).
  # It also verifies what it hears and runs the detector suite: the legacy authority counts
  # a unit as trusted infrastructure, and its reports go straight onto its backhaul. Its
  # backhaul is `net.backhaul`'s, and its hardware the default roadside profile
  # (rsu/commsignia-its-rs4, the one whose datasheet publishes a verification rate).
