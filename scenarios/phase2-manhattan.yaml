  backend:
    # The CAMP SCMS of 05-protocols.md: the online roles, butterfly key expansion, two
    # Linkage Authorities and the linkage-value CRL.
    protocol: protocol/scms/camp
    entities:
      ra: {}
      pca: {}
      la1: {}
      la2: {}
      ma: {}
      crlg: {}
      lop: {}
      crl_store: {}

weather:
  initial: clear
  intensity: 0.0

radio:
  rat: dsrc-80211p
  tiers:
    propagation: medium
    phy: medium
    mac: medium

net:
  layer: wsmp
  # Every vehicle has a cellular modem (the connected-vehicle TCU): the cell-capacity Uu
  # model at the 500 m urban-macro inter-site distance of TR 37.885, with the internet leg
  # from the operator's core to the backend added (Narayanan et al. WWW'20).
  uu:
    id: cellular/uu/cell-capacity-mm1
    params:
      isd_m: 500
      penetration: 1.0
  # The roadside units' wired backhaul.
  backhaul:
    id: backhaul/fixed
    params:
      latency_ms: 10
      capacity_mbps: 1000

messages:
  sets: [bsm]
  codec_tier: uper

security:
  envelope: ieee1609.2
  signature: ecdsa-p256
  crypto_mode: modeled
  # The credential lifecycle. Every cited default stays (a one-week i-period, 20
  # certificates per period, a lifetime an hour longer than the period) except three
  # calendar windows, compressed so a five-minute run reaches a revocation at all:
  #
  #   report_shuffle_window_s  CAMP-EE SCMS-765: "10,000 reports or one day"      -> 60 s
  #   crl_cadence_s            daily, the USDOT 2013 working assumption          -> 60 s
  #   crl_fetch_interval_s     uncited ("on every RA connection", OEM-set)      -> 30 s
  #
  # With the cited values the same path takes a day and a half, which is the real
  # answer for a deployment and the reason revocation-latency.yaml exists.
  protocol:
    id: protocol/scms/camp
    params:
      report_shuffle_window_s: 60
      crl_cadence_s: 60
      crl_fetch_interval_s: 30
  verification_policy: verify-all
  signer_id_policy:
    full_cert_every_ms: 1000
    digest_otherwise: true
  pseudonym_change:
    # The J2945/1 CERTCHG interval. The authority decides on evidence about one
    # certificate, so the path no longer needs a rotation inside the run.
    strategy: time
    period_s: 300.0

nodes:
  default_obu: obu/unex-obu-301-craton2
  compute_tier: medium
  backend_tier: medium

threats:
  attackers:
    # The legacy ConstPos attacker: it freezes its claimed position at the first instant it
    # acts and keeps broadcasting it while it drives away.
    - id: threat/attacker/legacy/ConstPos
      count: 1
      schedule:
        from_s: 5.0
        to_s: 300.0

detection:
  local:
    - id: detect/legacy-12
  # The legacy authority's persistence gate at its legacy operating point: 3 trusted
  # reporters, reports in 4 distinct seconds spanning 3 s inside a 15 s window.
  ma:
    id: threat/ma/legacy-window

metrics: [all]

exporters: []
