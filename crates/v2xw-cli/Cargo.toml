[package]
name = "v2xw-cli"
description = "The `v2xw` command-line control surface."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# The tool is a library plus a thin binary: every command is a plain function over an
# options struct, so the tests call them directly rather than shelling out to a binary and
# parsing its output.
[lib]
name = "v2xw_cli"
path = "src/lib.rs"

[[bin]]
name = "v2xw"
path = "src/main.rs"

[dependencies]
v2xw-core = { workspace = true }
v2xw-world = { workspace = true }
v2xw-mobility = { workspace = true }
v2xw-radio = { workspace = true }
v2xw-net = { workspace = true }
v2xw-msg = { workspace = true }
v2xw-sec = { workspace = true }
v2xw-node = { workspace = true }
v2xw-proto = { workspace = true }
v2xw-threat = { workspace = true }
v2xw-metrics = { workspace = true }
v2xw-record = { workspace = true }
v2xw-server = { workspace = true }
# The kernel. Not a `workspace = true` entry because `v2xw-engine` is a workspace member
# that the root manifest's shared dependency table does not list.
v2xw-engine = { path = "../v2xw-engine", version = "0.1.0" }
# The experiment runner behind `v2xw experiment`. Same reason it is a path dependency: the
# root manifest's shared table does not list it. The dependency goes this way round on
# purpose — the runner does not know about the command line, it takes a `RunExecutor`, and
# `src/experiment.rs` is the implementation that calls `v2xw run`.
v2xw-experiment = { path = "../v2xw-experiment", version = "0.1.0" }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
