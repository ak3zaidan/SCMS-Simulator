    min: {value: null, status: not-applicable, calibration: "no radio on this profile"}
    max: {value: null, status: not-applicable, calibration: "no radio on this profile"}
    default: {value: null, status: not-applicable, calibration: "no radio on this profile"}
  sensitivity_dbm: {value: null, status: not-applicable, calibration: "no radio on this profile"}
  noise_figure_db: {value: null, status: not-applicable, calibration: "no radio on this profile"}
  antenna:
    gain_dbi: {value: null, status: not-applicable, calibration: "no radio on this profile"}
    height_m: {value: null, status: not-applicable, calibration: "no radio on this profile"}
    pattern: {value: null, status: not-applicable, calibration: "no radio on this profile"}
power_w: {value: null, status: not-published, calibration: "a cloud VM's draw is not modelled; if a scenario needs it, take the instance type's published TDP share"}
storage_model: inherit
