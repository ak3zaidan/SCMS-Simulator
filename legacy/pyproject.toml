[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scms-sim-ref"
version = "0.1.0"
description = "SCMS-aware V2X simulation & global Misbehavior-Authority dataset framework (Python reference core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["cryptography>=42", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scms-poc = "scms_sim_ref.mock_pipeline.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
