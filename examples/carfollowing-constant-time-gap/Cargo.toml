# Worked example: a `CarFollowing` plug-in.
#
# `v2xw-world` is a dev-dependency only: the model itself never names a world type — a
# car-following model is handed views and nothing else — but building a `LaneView` in a
# test needs `LaneKind` and `ClassMask`, which live there. It costs nothing to compile,
# because `v2xw-mobility` already depends on it.
[package]
name = "v2xw-example-carfollowing"
description = "Worked example: a constant-time-gap car-following plug-in."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
v2xw-core = { workspace = true }
v2xw-mobility = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
v2xw-world = { path = "../../crates/v2xw-world", version = "0.1.0" }
